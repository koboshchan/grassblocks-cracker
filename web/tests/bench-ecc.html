<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ECC WebGPU Profiler</title>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; margin: 20px; background: #1a1a1a; color: #eee; }
    button { background: #2563eb; color: #fff; border: 0; padding: 8px 16px; border-radius: 4px; font-weight: bold; cursor: pointer; }
    button:disabled { opacity: 0.5; }
    pre { background: #111; padding: 12px; border-radius: 6px; overflow-x: auto; font-family: ui-monospace, monospace; font-size: 13px; line-height: 1.4; }
    table { border-collapse: collapse; width: 100%; margin-top: 10px; }
    th, td { border: 1px solid #333; padding: 6px 10px; text-align: left; }
    th { background: #222; }
  </style>
</head>
<body>
  <h2>WebGPU ECC Profiler & Harness</h2>
  <div style="margin-bottom: 15px;">
    <button id="btnRun">Run ECC Benchmark</button>
    <label style="margin-left: 15px;">Batch size:
      <select id="batchSize">
        <option value="1">1 quad</option>
        <option value="8" selected>8 quads</option>
        <option value="16">16 quads</option>
        <option value="32">32 quads</option>
        <option value="64">64 quads</option>
      </select>
    </label>
    <label style="margin-left: 15px;">Iterations:
      <input type="number" id="numIters" value="60" min="1" max="60" style="width: 50px;">
    </label>
  </div>
  <div id="status">Loading image and reference...</div>
  <pre id="output"></pre>

  <script type="module">
    import { eccShader } from './ecc-shader.js';

    const $ = id => document.getElementById(id);
    const out = $('output');
    const log = msg => { console.log(msg); out.textContent += msg + '\n'; };

    let device, imageTexture, refsBuffer, quads = [], rotations = [];

    async function init() {
      if (!navigator.gpu) {
        $('status').textContent = 'WebGPU not supported';
        return;
      }
      const adapter = await navigator.gpu.requestAdapter();
      const hasTimestamp = adapter.features.has('timestamp-query');
      device = await adapter.requestDevice({
        requiredFeatures: hasTimestamp ? ['timestamp-query'] : []
      });
      $('status').textContent = `Adapter: ${adapter.info?.architecture || 'GPU'} (timestamp-query: ${hasTimestamp})`;

      // Load savanna image
      const img = new Image();
      img.src = 'fixtures/savanna.png';
      await new Promise(r => img.onload = r);

      // Create GPUTexture for savanna image
      imageTexture = device.createTexture({
        size: [img.width, img.height, 1],
        format: 'rgba8unorm',
        usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST | GPUTextureUsage.RENDER_ATTACHMENT
      });
      const canvas = document.createElement('canvas');
      canvas.width = img.width;
      canvas.height = img.height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);
      const imgData = ctx.getImageData(0, 0, img.width, img.height);
      device.queue.writeTexture(
        { texture: imageTexture },
        imgData.data.buffer,
        { bytesPerRow: img.width * 4 },
        [img.width, img.height, 1]
      );

      // Load reference texture
      const refImg = new Image();
      refImg.src = '../public/grass_block_top.png';
      await new Promise(r => refImg.onload = r);
      const refCanvas = document.createElement('canvas');
      refCanvas.width = 16;
      refCanvas.height = 16;
      const rx = refCanvas.getContext('2d');
      rx.drawImage(refImg, 0, 0);
      const refData = rx.getImageData(0, 0, 16, 16).data;
      const refGreen = [];
      for (let y = 0; y < 16; y++) {
        refGreen.push([]);
        for (let x = 0; x < 16; x++) refGreen[y].push(refData[4 * (y * 16 + x) + 1]);
      }

      // Precompute 4 rotations for reference
      const refs = new Float32Array(256 * 4);
      for (let rot = 0; rot < 4; rot++) {
        for (let y = 0; y < 16; y++) {
          for (let x = 0; x < 16; x++) {
            let xx = x, yy = y;
            for (let j = 0; j < rot; j++) {
              const t = xx; xx = yy; yy = 15 - t;
            }
            refs[(y * 16 + x) * 4 + rot] = refGreen[yy][xx];
          }
        }
      }
      refsBuffer = device.createBuffer({
        size: refs.byteLength,
        usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST
      });
      device.queue.writeBuffer(refsBuffer, 0, refs);

      // Load candidate quads from savanna fixture
      const blocksRes = await fetch('fixtures/savanna-blocks.json');
      const blocksData = await blocksRes.json();
      quads = [];
      rotations = [];
      for (const t of blocksData.trials || []) {
        for (const b of t.orderedBlocks || []) {
          quads.push(b.quad);
          rotations.push(b.rotation);
        }
      }
      $('status').textContent += ` | Loaded ${img.width}x${img.height} savanna image & ${quads.length} candidate quads.`;
      $('btnRun').disabled = false;
    }

    init().catch(e => {
      console.error(e);
      $('status').textContent = 'Error: ' + e.message;
    });

    $('btnRun').onclick = async () => {
      $('btnRun').disabled = true;
      out.textContent = '';
      try {
        await runBenchmark();
      } catch (e) {
        log('Error: ' + e.stack);
      }
      $('btnRun').disabled = false;
    };

    function quadBase(q) {
      const [a, b, c, d] = q;
      const dx1 = b[0] - c[0], dx2 = d[0] - c[0], dx3 = a[0] - b[0] + c[0] - d[0];
      const dy1 = b[1] - c[1], dy2 = d[1] - c[1], dy3 = a[1] - b[1] + c[1] - d[1];
      const det = dx1 * dy2 - dx2 * dy1;
      const g = (dx3 * dy2 - dx2 * dy3) / det / 128;
      const h = (dx1 * dy3 - dx3 * dy1) / det / 128;
      return [
        (b[0] - a[0]) / 128 + g * b[0],
        (d[0] - a[0]) / 128 + h * d[0],
        a[0],
        (b[1] - a[1]) / 128 + g * b[1],
        (d[1] - a[1]) / 128 + h * d[1],
        a[1],
        g, h, 1
      ];
    }

    async function runBenchmark() {
      const count = parseInt($('batchSize').value, 10);
      const iters = parseInt($('numIters').value, 10);
      log(`=== Profiling ECC with batch size = ${count}, iterations = ${iters} ===`);

      const batchQuads = quads.slice(0, count);
      const batchRotations = rotations.slice(0, count);

      // Compile shaders
      const shaderModule = device.createShaderModule({ code: eccShader });
      const entries = ['prepare', 'gaussian', 'gradients', 'warp_pixels', 'statistics', 'jacobian', 'normal_equations', 'update'];
      const layout = device.createBindGroupLayout({
        entries: [
          { binding: 0, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'uniform' } },
          { binding: 1, visibility: GPUShaderStage.COMPUTE, texture: { sampleType: 'float' } },
          ...[2, 3, 4, 5, 6, 7].map(binding => ({
            binding,
            visibility: GPUShaderStage.COMPUTE,
            buffer: { type: binding === 2 ? 'read-only-storage' : 'storage' }
          }))
        ]
      });
      const pl = device.createPipelineLayout({ bindGroupLayouts: [layout] });
      const pipelines = [];
      for (const entryPoint of entries) {
        pipelines.push(await device.createComputePipelineAsync({
          layout: pl,
          compute: { module: shaderModule, entryPoint }
        }));
      }

      // Buffers
      const rw = GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST | GPUBufferUsage.COPY_SRC;
      const params = device.createBuffer({ size: 16, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
      const states = device.createBuffer({ size: count * 28 * 4, usage: rw });
      const patch = device.createBuffer({ size: count * 81920 * 4, usage: rw });
      const pixels = device.createBuffer({ size: count * 16384 * 5 * 4, usage: rw });
      const jac = device.createBuffer({ size: count * 16384 * 8 * 4, usage: rw });
      const sums = device.createBuffer({ size: count * 86 * 4, usage: rw });
      const read = device.createBuffer({ size: count * (28 + 86) * 4, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST });

      // Init states
      const initial = new Float32Array(count * 28);
      batchQuads.forEach((q, i) => {
        const base = quadBase(q);
        const s = i * 28;
        initial.set(base, s);
        initial.set([1, 0, 0, 0, 1, 0, 0, 0, 1], s + 9);
        initial[s + 18] = -1;
        initial[s + 19] = -0.00001;
        initial[s + 20] = base.every(Number.isFinite) ? 0 : -2;
        initial[s + 22] = batchRotations[i];
      });

      device.queue.writeBuffer(params, 0, new Uint32Array([3360, 2100, count, 0]));
      device.queue.writeBuffer(states, 0, initial);

      const bindGroup = device.createBindGroup({
        layout,
        entries: [
          { binding: 0, resource: { buffer: params } },
          { binding: 1, resource: imageTexture.createView() },
          { binding: 2, resource: { buffer: refsBuffer } },
          { binding: 3, resource: { buffer: states } },
          { binding: 4, resource: { buffer: patch } },
          { binding: 5, resource: { buffer: pixels } },
          { binding: 6, resource: { buffer: jac } },
          { binding: 7, resource: { buffer: sums } },
        ]
      });


      // Timestamps for a single representative iteration (to measure exact kernel breakdown):
      // 0, 1: total iterations
      // 2, 3: prep
      // 4, 5: warp_pixels
      // 6, 7: statistics
      // 8, 9: jacobian
      // 10, 11: normal_equations
      // 12, 13: update
      const hasTimestamps = device.features.has('timestamp-query');
      let querySet, queryBuffer, queryReadback;
      if (hasTimestamps) {
        querySet = device.createQuerySet({ type: 'timestamp', count: 14 });
        queryBuffer = device.createBuffer({ size: 14 * 8, usage: GPUBufferUsage.QUERY_RESOLVE | GPUBufferUsage.COPY_SRC });
        queryReadback = device.createBuffer({ size: 14 * 8, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST });
      }

      const encoder = device.createCommandEncoder();
      for (const buffer of [patch, pixels, jac, sums]) encoder.clearBuffer(buffer);

      const pass = (compute, index, x, y = 1) => {
        compute.setPipeline(pipelines[index]);
        compute.dispatchWorkgroups(x, y);
      };

      // 1. Prep pass
      const prepPass = encoder.beginComputePass(hasTimestamps ? {
        timestampWrites: { querySet, beginningOfPassWriteIndex: 2, endOfPassWriteIndex: 3 }
      } : {});
      prepPass.setBindGroup(0, bindGroup);
      pass(prepPass, 0, 256, count);
      pass(prepPass, 1, 256, count);
      pass(prepPass, 2, 256, count);
      prepPass.end();

      // 2. Measure first iteration broken down by kernel
      const pWarp = encoder.beginComputePass(hasTimestamps ? { timestampWrites: { querySet, beginningOfPassWriteIndex: 4, endOfPassWriteIndex: 5 } } : {});
      pWarp.setBindGroup(0, bindGroup); pass(pWarp, 3, 256, count); pWarp.end();

      const pStat = encoder.beginComputePass(hasTimestamps ? { timestampWrites: { querySet, beginningOfPassWriteIndex: 6, endOfPassWriteIndex: 7 } } : {});
      pStat.setBindGroup(0, bindGroup); pass(pStat, 4, count, 1); pStat.end();

      const pJac = encoder.beginComputePass(hasTimestamps ? { timestampWrites: { querySet, beginningOfPassWriteIndex: 8, endOfPassWriteIndex: 9 } } : {});
      pJac.setBindGroup(0, bindGroup); pass(pJac, 5, 256, count); pJac.end();

      const pNorm = encoder.beginComputePass(hasTimestamps ? { timestampWrites: { querySet, beginningOfPassWriteIndex: 10, endOfPassWriteIndex: 11 } } : {});
      pNorm.setBindGroup(0, bindGroup); pass(pNorm, 6, count, 1); pNorm.end();

      const pUpd = encoder.beginComputePass(hasTimestamps ? { timestampWrites: { querySet, beginningOfPassWriteIndex: 12, endOfPassWriteIndex: 13 } } : {});
      pUpd.setBindGroup(0, bindGroup); pass(pUpd, 7, count); pUpd.end();

      // 3. Remaining iterations in a single fused pass with overall timestamps
      const iterPass = encoder.beginComputePass(hasTimestamps ? {
        timestampWrites: { querySet, beginningOfPassWriteIndex: 0, endOfPassWriteIndex: 1 }
      } : {});
      iterPass.setBindGroup(0, bindGroup);
      for (let i = 1; i < iters; i++) {
        pass(iterPass, 3, 256, count);
        pass(iterPass, 4, count, 1);
        pass(iterPass, 5, 256, count);
        pass(iterPass, 6, count, 1);
        pass(iterPass, 7, count);
      }
      iterPass.end();

      if (hasTimestamps) {
        encoder.resolveQuerySet(querySet, 0, 12, queryBuffer, 0);
        encoder.copyBufferToBuffer(queryBuffer, 0, queryReadback, 0, 12 * 8);
      }
      encoder.copyBufferToBuffer(states, 0, read, 0, initial.byteLength);
      encoder.copyBufferToBuffer(sums, 0, read, initial.byteLength, count * 86 * 4);

      const t0 = performance.now();
      device.queue.submit([encoder.finish()]);
      await read.mapAsync(GPUMapMode.READ);
      const wallMs = performance.now() - t0;

      let gpuMs = null;
      if (hasTimestamps) {
        await queryReadback.mapAsync(GPUMapMode.READ);
        const qData = new BigInt64Array(queryReadback.getMappedRange());
        const ns = (a, b) => Number(qData[b] - qData[a]) / 1e6;
        const totalNs = ns(0, 1) + ns(4, 5) + ns(6, 7) + ns(8, 9) + ns(10, 11) + ns(12, 13);
        gpuMs = totalNs;
        log(`Prep (passes 0..2):    ${ns(2, 3).toFixed(3)} ms`);
        log(`-- Per-Iteration Kernel Times (1 iter) --`);
        log(`warp_pixels:           ${ns(4, 5).toFixed(3)} ms`);
        log(`statistics:            ${ns(6, 7).toFixed(3)} ms`);
        log(`jacobian:              ${ns(8, 9).toFixed(3)} ms`);
        log(`normal_equations:      ${ns(10, 11).toFixed(3)} ms`);
        log(`update:                ${ns(12, 13).toFixed(3)} ms`);
        log(`Sum of 1 iteration:    ${(ns(4, 5) + ns(6, 7) + ns(8, 9) + ns(10, 11) + ns(12, 13)).toFixed(3)} ms`);
        queryReadback.unmap();
      }

      log(`Host wall time: ${wallMs.toFixed(2)} ms (${(wallMs / count).toFixed(2)} ms/quad)`);
      if (gpuMs !== null) {
        log(`GPU total time: ${gpuMs.toFixed(2)} ms (${(gpuMs / count).toFixed(2)} ms/quad)`);
      }

      // Check results
      const raw = new Float32Array(read.getMappedRange());
      let converged = 0, limit = 0, failed = 0;
      for (let i = 0; i < count; i++) {
        const s = i * 28;
        const status = raw[s + 20];
        const pad = raw[s + 23];
        if (status < 0) failed++;
        else if (pad === 1) converged++;
        else if (pad === 2) limit++;
      }
      read.unmap();
      log(`Results: ${converged} converged, ${limit} iteration limit, ${failed} failed`);
    }
  </script>
</body>
</html>
