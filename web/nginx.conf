server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript text/javascript application/json application/wasm;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location ~ \.wasm$ { types { application/wasm wasm; } expires 1h; try_files $uri =404; }
    location ~ \.wgsl$ { types { text/plain wgsl; } expires 1h; try_files $uri =404; }
    location / { try_files $uri $uri/ =404; }
}
